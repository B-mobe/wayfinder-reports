name: Data report
description: Paste the report from Settings > Help improve Wayfinder > Copy report.
title: "Data report"
labels: ["data-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Wayfinder! In game, open
        **Settings > Help improve Wayfinder > Copy report**, click
        **Select all**, copy (Ctrl+C) and paste the text below.
        Please don't edit the text - it is checked automatically.
  - type: textarea
    id: report
    attributes:
      label: Report
      description: The text from Copy report (it starts with WFR1).
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
      description: Anything else you noticed that Wayfinder got wrong.
    validations:
      required: false
